name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats SVG
        run: curl -s "https://github-readme-stats.vercel.app/api?username=Ankesh04&show_icons=true&theme=tokyonight&hide_border=true" -o stats.svg

      - name: Fetch top languages SVG
        run: curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Ankesh04&layout=compact&theme=tokyonight&hide_border=true" -o top-langs.svg

      - name: Fetch trophies SVG
        run: curl -s "https://github-profile-trophy.vercel.app/?username=Ankesh04&theme=tokyonight&no-frame=true&row=2&column=4" -o trophies.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg trophies.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stats SVGs" && git push)